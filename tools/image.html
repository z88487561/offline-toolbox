<script>

    const { PDFDocument } = PDFLib;

    const { jsPDF } = window.jspdf; // 取得極限壓縮用的函式庫

    let cropper = null;

    let currentFileName = "output";



    const showLoad = (s, txt = "處理中...") => {

        document.getElementById('loading').style.display = s ? 'block' : 'none';

        document.getElementById('loading-txt').innerText = txt;

    };



    // --- 佈局控制 ---

    const toggleLayout = (isEditing) => {

        if (window.innerWidth <= 850) {

            document.body.classList.toggle('editing', isEditing);

            if(isEditing) document.getElementById('sidebar').scrollTop = 0;

        }

    };



    // --- 側邊欄改為固定 ---



    // 編輯裁切邏輯已移除



    // --- 批次功能 ---

    function updateQualityInput() {
        const fmt = document.getElementById('targetFormat').value;
        const qInput = document.getElementById('targetQuality');
        if (fmt === 'image/png') {
            qInput.disabled = true;
            qInput.title = 'PNG 為無損格式，不需設定品質';
            qInput.style.opacity = '0.5';
        } else {
            qInput.disabled = false;
            qInput.title = '品質 0.1 ~ 1.0';
            qInput.style.opacity = '1';
        }
    }

    async function batchResize() {
        const files = document.getElementById('resizeFiles').files;
        const widthValue = document.getElementById('reWidth').value.trim();
        const heightValue = document.getElementById('reHeight').value.trim();
        const tw = widthValue ? Number(widthValue) : 0;
        const th = heightValue ? Number(heightValue) : 0;
        if(!files.length) return alert("請先選取圖片");
        if (!Number.isSafeInteger(tw) || !Number.isSafeInteger(th) || tw < 0 || th < 0 || (!tw && !th)) {
            return alert("請輸入大於 0 的寬度或高度");
        }

        showLoad(true);
        try {
            for(let i=0; i<files.length; i++) {
                showLoad(true, `縮圖中 (${i+1}/${files.length})：${files[i].name}`);
                const img = await fileToImage(files[i]).catch(error => {
                    alert(error.message);
                    return null;
                });
                if (!img) continue;

                let finalW, finalH;
                if (tw && !th) { finalW = tw; finalH = img.height * (tw / img.width); }
                else if (!tw && th) { finalH = th; finalW = img.width * (th / img.height); }
                else {
                    const ratio = Math.min(tw / img.width, th / img.height);
                    finalW = img.width * ratio; finalH = img.height * ratio;
                }
                const cvs = document.createElement('canvas');
                const outputWidth = Math.max(1, Math.round(finalW));
                const outputHeight = Math.max(1, Math.round(finalH));
                cvs.width = outputWidth; cvs.height = outputHeight;
                cvs.getContext('2d').drawImage(img, 0, 0, outputWidth, outputHeight);
                await saveCanvas(cvs, `res-${files[i].name.replace(/\.[^/.]+$/, '')}.jpg`, 0.85, 'image/jpeg');
                await new Promise(r => setTimeout(r, 400));
            }
        } catch(err) {
            alert("縮圖發生錯誤: " + err.message);
        } finally {
            showLoad(false);
        }
    }

    async function batchConvertImages() {
        const files = document.getElementById('convFiles').files;
        if(!files.length) return alert("請先選取要轉檔的圖片！");

        const format = document.getElementById('targetFormat')?.value || 'image/jpeg';
        const q = parseFloat(document.getElementById('targetQuality').value);
        if (!Number.isFinite(q) || q < 0.1 || q > 1) return alert("品質請輸入 0.1 至 1.0");
        const extMap = {
            'image/jpeg': '.jpg',
            'image/png': '.png',
            'image/webp': '.webp'
        };
        const targetExt = extMap[format] || '.jpg';

        showLoad(true, "準備轉檔...");
        try {
            for(let i=0; i<files.length; i++) {
                const f = files[i];
                showLoad(true, `轉檔中 (${i+1}/${files.length})：${f.name}`);

                const baseName = f.name.replace(/\.[^/.]+$/, "");
                const img = await fileToImage(f).catch(error => {
                    alert(`處理 ${f.name} 時失敗: ${error.message}`);
                    return null;
                });
                if (!img) continue;

                const cvs = document.createElement('canvas');
                cvs.width = img.width;
                cvs.height = img.height;
                const ctx = cvs.getContext('2d');
                if (format === 'image/jpeg') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, cvs.width, cvs.height);
                }
                ctx.drawImage(img, 0, 0);

                await saveCanvas(cvs, `${baseName}${targetExt}`, q, format);
                await new Promise(r => setTimeout(r, 400));
            }
        } catch (error) {
            alert("轉檔過程發生錯誤：" + error.message);
        } finally {
            showLoad(false);
        }
    }
    window.batchConvertToJpg = batchConvertImages;

    // 標準 PDF 合成 (pdf-lib)
    async function imagesToPdf() {
        const files = document.getElementById('pdfFiles').files;
        if (!files.length) return alert("請先選取檔案");
        showLoad(true, "正在合成 PDF...");
        try {
            const pdfDoc = await PDFDocument.create();
            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                showLoad(true, `處理中 (${i+1}/${files.length})：${f.name}`);
                const img = await fileToImage(f);
                const cvs = document.createElement('canvas');
                cvs.width = img.width;
                cvs.height = img.height;
                const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, cvs.width, cvs.height);
                ctx.drawImage(img, 0, 0);

                const jpeg = await new Promise((resolve, reject) => {
                    cvs.toBlob(blob => blob ? resolve(blob) : reject(new Error('圖片編碼失敗')), 'image/jpeg', 0.85);
                });
                const bytes = await jpeg.arrayBuffer();
                const pImg = await pdfDoc.embedJpg(bytes);
                const isL = img.width > img.height;
                const page = pdfDoc.addPage(isL ? [842, 595] : [595, 842]);
                const r = Math.min(page.getWidth()/img.width, page.getHeight()/img.height);
                page.drawImage(pImg, {
                    x: (page.getWidth() - img.width * r) / 2,
                    y: (page.getHeight() - img.height * r) / 2,
                    width: img.width * r,
                    height: img.height * r
                });
            }
            const b = await pdfDoc.save();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([b], {type:'application/pdf'}));
            a.download = `merged_${Date.now()}.pdf`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        } catch (e) {
            alert("PDF 失敗: " + e.message);
        } finally {
            showLoad(false);
        }
    }

    // 極限壓縮 PDF 合成 (jsPDF)
    async function imagesToPdfExtreme() {
        const files = Array.from(document.getElementById('pdfFiles').files);
        if (files.length === 0) return alert('請先選取照片！');

        showLoad(true, "極限壓縮中...");
        try {
            const pdf = new jsPDF('p', 'pt');
            let addedCount = 0;

            for (let i = 0; i < files.length; i++) {
                showLoad(true, `壓縮處理中 (${i + 1} / ${files.length})：${files[i].name}`);
                const img = await fileToImage(files[i]);
                
                let tw = img.width;
                let th = img.height;
                const maxRes = 1600; 
                if (tw > maxRes || th > maxRes) {
                    const ratio = Math.min(maxRes / tw, maxRes / th);
                    tw *= ratio; th *= ratio;
                }

                const canvas = document.createElement('canvas');
                canvas.width = tw;
                canvas.height = th;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, tw, th);
                ctx.filter = 'contrast(1.1) saturate(0.9)'; 
                ctx.drawImage(img, 0, 0, tw, th);

                const imgData = canvas.toDataURL('image/jpeg', 0.4);
                const orientation = tw > th ? 'l' : 'p';

                if (addedCount === 0) {
                    pdf.setPage(1);
                    pdf.addPage([tw, th], orientation);
                    pdf.deletePage(1); 
                } else {
                    pdf.addPage([tw, th], orientation);
                }

                pdf.addImage(imgData, 'JPEG', 0, 0, tw, th);
                addedCount++;
                await new Promise(r => setTimeout(r, 100)); 
            }

            showLoad(true, "打包 PDF 中...");
            pdf.save(`Compressed_${Date.now()}.pdf`);
        } catch (err) {
            console.error(err);
            alert("壓縮過程中發生錯誤: " + err.message);
        } finally {
            showLoad(false);
        }
    }

    // 圖片拼接合併 (單張圖輸出，含防破瀏覽器上限保護)
    async function stitchImages(direction = 'vertical') {
        const files = document.getElementById('stitchFiles').files;
        if (!files.length) return alert("請先選取要拼接合併的圖片！");

        showLoad(true, "載入圖片中...");
        try {
            const loadedImages = [];
            for (let i = 0; i < files.length; i++) {
                showLoad(true, `載入圖片 (${i+1}/${files.length})：${files[i].name}`);
                const img = await fileToImage(files[i]);
                loadedImages.push(img);
            }

            showLoad(true, "計算畫布最佳尺寸...");
            const resolution = document.getElementById('stitchResolution')?.value || 'auto';
            const cvs = document.createElement('canvas');
            const ctx = cvs.getContext('2d');

            if (direction === 'vertical') {
                // 垂直長圖：以基準寬度對齊，計算總高度
                let baseWidth = Math.max(...loadedImages.map(img => img.width));
                if (resolution === '1920') baseWidth = 1920;
                else if (resolution === '1080') baseWidth = 1080;

                let totalHeight = loadedImages.reduce((sum, img) => sum + (img.height * (baseWidth / img.width)), 0);

                // 瀏覽器 65,535px 極限保護與智慧等比縮小
                let scale = 1;
                const maxDim = (resolution === 'original') ? 60000 : 30000;
                if (totalHeight > maxDim) {
                    scale = Math.min(scale, maxDim / totalHeight);
                }
                // 總像素面積記憶體保護 (上限約 1.6 億像素)
                if ((baseWidth * scale) * (totalHeight * scale) > 160000000) {
                    const areaScale = Math.sqrt(160000000 / ((baseWidth * scale) * (totalHeight * scale)));
                    scale = Math.min(scale, areaScale);
                }

                const finalW = Math.max(1, Math.round(baseWidth * scale));
                const finalH = Math.max(1, Math.round(totalHeight * scale));

                showLoad(true, `拼接中 (${finalW} x ${finalH} px)...`);
                cvs.width = finalW;
                cvs.height = finalH;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, finalW, finalH);

                let currentY = 0;
                for (const img of loadedImages) {
                    const drawHeight = Math.round(img.height * (finalW / img.width));
                    ctx.drawImage(img, 0, currentY, finalW, drawHeight);
                    currentY += drawHeight;
                }
            } else {
                // 水平拼圖：以基準高度對齊，計算總寬度
                let baseHeight = Math.max(...loadedImages.map(img => img.height));
                if (resolution === '1920') baseHeight = 1920;
                else if (resolution === '1080') baseHeight = 1080;

                let totalWidth = loadedImages.reduce((sum, img) => sum + (img.width * (baseHeight / img.height)), 0);

                let scale = 1;
                const maxDim = (resolution === 'original') ? 60000 : 30000;
                if (totalWidth > maxDim) {
                    scale = Math.min(scale, maxDim / totalWidth);
                }
                if ((totalWidth * scale) * (baseHeight * scale) > 160000000) {
                    const areaScale = Math.sqrt(160000000 / ((totalWidth * scale) * (baseHeight * scale)));
                    scale = Math.min(scale, areaScale);
                }

                const finalW = Math.max(1, Math.round(totalWidth * scale));
                const finalH = Math.max(1, Math.round(baseHeight * scale));

                showLoad(true, `拼接中 (${finalW} x ${finalH} px)...`);
                cvs.width = finalW;
                cvs.height = finalH;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, finalW, finalH);

                let currentX = 0;
                for (const img of loadedImages) {
                    const drawWidth = Math.round(img.width * (finalH / img.height));
                    ctx.drawImage(img, currentX, 0, drawWidth, finalH);
                    currentX += drawWidth;
                }
            }

            showLoad(true, "正在輸出圖片檔案...");
            await saveCanvas(cvs, `merged_${direction}_${Date.now()}.jpg`, 0.88, 'image/jpeg');
        } catch (e) {
            console.error("合併失敗:", e);
            alert("合併圖片失敗: " + e.message);
        } finally {
            showLoad(false);
        }
    }

    // --- 工具庫與通用圖片解碼 ---
    function fileToDataURL(f) {
        return new Promise(res => {
            const r = new FileReader();
            r.onload = e => res(e.target.result);
            r.readAsDataURL(f);
        });
    }

    async function fileToImage(f) {
        if (!f) throw new Error("無效的檔案");
        const name = f.name || '';
        const ext = name.split('.').pop().toLowerCase();
        const mime = (f.type || '').toLowerCase();

        // 1. HEIC / HEIF 支援
        if (ext === 'heic' || ext === 'heif' || mime === 'image/heic' || mime === 'image/heif') {
            if (typeof heic2any === 'function') {
                try {
                    const res = await heic2any({
                        blob: f,
                        toType: 'image/jpeg',
                        quality: 0.95
                    });
                    const blob = Array.isArray(res) ? res[0] : res;
                    return await blobToImage(blob);
                } catch (err) {
                    console.warn('heic2any 解碼失敗，嘗試瀏覽器原生解碼:', err);
                }
            } else {
                console.warn('heic2any 尚未載入');
            }
        }

        // 2. TIFF / TIF 支援
        if (ext === 'tif' || ext === 'tiff' || mime === 'image/tiff') {
            if (typeof UTIF !== 'undefined') {
                try {
                    const buffer = await f.arrayBuffer();
                    const ifds = UTIF.decode(buffer);
                    if (ifds && ifds.length > 0) {
                        UTIF.decodeImage(buffer, ifds[0]);
                        const rgba = UTIF.toRGBA8(ifds[0]);
                        const cvs = document.createElement('canvas');
                        cvs.width = ifds[0].width;
                        cvs.height = ifds[0].height;
                        const ctx = cvs.getContext('2d');
                        const imgData = ctx.createImageData(cvs.width, cvs.height);
                        imgData.data.set(rgba);
                        ctx.putImageData(imgData, 0, 0);
                        return await canvasToImage(cvs);
                    }
                } catch (err) {
                    console.warn('UTIF 解碼失敗，嘗試瀏覽器原生解碼:', err);
                }
            }
        }

        // 3. 標準瀏覽器原生支援 (JPG, PNG, WebP, AVIF, GIF, BMP, SVG, ICO 等)
        try {
            return await standardFileToImage(f);
        } catch (nativeErr) {
            if (typeof heic2any === 'function' && ext !== 'svg') {
                try {
                    const res = await heic2any({ blob: f, toType: 'image/jpeg', quality: 0.95 });
                    const blob = Array.isArray(res) ? res[0] : res;
                    return await blobToImage(blob);
                } catch (e2) {}
            }
            throw new Error(`無法讀取圖片：${f.name}（格式不支援或檔案損壞）`);
        }
    }

    function standardFileToImage(f) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(f);
            const image = new Image();
            image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
            image.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`無法讀取圖片：${f.name}`)); };
            image.src = url;
        });
    }

    function blobToImage(blob) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(blob);
            const image = new Image();
            image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
            image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('圖片解碼載入失敗')); };
            image.src = url;
        });
    }

    function canvasToImage(cvs) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('Canvas 轉圖片失敗'));
            img.src = cvs.toDataURL();
        });
    }

    function canvasToBlob(canvas, type = 'image/jpeg', quality = 0.85) {
        return new Promise((resolve, reject) => {
            canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('圖片輸出失敗 (畫布超出瀏覽器硬體上限)')), type, quality);
        });
    }

    async function safeCanvasToBlob(cvs, format = 'image/jpeg', quality = 0.85) {
        try {
            return await canvasToBlob(cvs, format, quality);
        } catch (err) {
            console.warn("初次輸出失敗，啟動安全縮小 50% 容錯重試...", err);
            const retryCvs = document.createElement('canvas');
            retryCvs.width = Math.max(1, Math.round(cvs.width * 0.5));
            retryCvs.height = Math.max(1, Math.round(cvs.height * 0.5));
            const rCtx = retryCvs.getContext('2d');
            rCtx.drawImage(cvs, 0, 0, retryCvs.width, retryCvs.height);
            return await canvasToBlob(retryCvs, format, quality);
        }
    }

    async function saveCanvas(cvs, n, q = 0.85, format = 'image/jpeg') {
        const blob = await safeCanvasToBlob(cvs, format, q);
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = n;
        link.href = url;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function applyScanEnhancement(canvas) {
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            let avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            avg = avg < 128 ? Math.pow(avg / 128, 1.4) * 128 : 255 - Math.pow((255 - avg) / 127, 1.4) * 127;
            if (avg > 195) avg = 255; if (avg < 45) avg = 0;
            data[i] = data[i+1] = data[i+2] = avg;
        }
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }
